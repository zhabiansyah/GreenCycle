# ===============================
# KONFIGURASI DATABASE MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/db_greencycle?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# ===============================
# KONFIGURASI HIBERNATE (PEMBUAT TABEL OTOMATIS)
# ===============================
# 'update' berarti: buat tabel jika belum ada, dan jangan hapus data saat server mati
spring.jpa.hibernate.ddl-auto=update

# Untuk melihat query SQL yang dijalankan Spring Boot di terminal (opsional, bagus untuk debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect